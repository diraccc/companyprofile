<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Setup Passkey Dirac Admin</title>
  <style>
    body{font-family:system-ui;background:#050814;color:white;padding:20px}
    .card{max-width:520px;margin:auto;background:#111a2e;border:1px solid #60a5fa55;border-radius:22px;padding:20px}
    button{width:100%;padding:13px;border:0;border-radius:999px;font-weight:800;background:#60a5fa;color:#071021}
    textarea{width:100%;height:220px;margin-top:14px;border-radius:14px;padding:12px}
    .msg{margin-top:12px;color:#bfdbfe;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="card">
    <h2>Setup Passkey Admin</h2>
    <p>Klik tombol ini untuk membuat passkey/fingerprint admin.</p>

    <button id="btn">Buat Passkey</button>

    <div class="msg" id="msg"></div>
    <textarea id="out" placeholder="Hasil credentialJson muncul di sini"></textarea>
  </div>

<script>
const BACKEND = "https://companyprofilee-expk.vercel.app";

function b64urlToBuffer(value){
  value = String(value).replace(/-/g, "+").replace(/_/g, "/");
  const pad = value.length % 4;
  if (pad) value += "=".repeat(4 - pad);
  const str = atob(value);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}

function bufferToB64url(buffer){
  const bytes = new Uint8Array(buffer);
  let str = "";
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function prepareOptions(options){
  const publicKey = structuredClone(options);

  publicKey.challenge = b64urlToBuffer(publicKey.challenge);
  publicKey.user.id = b64urlToBuffer(publicKey.user.id);

  if (publicKey.excludeCredentials) {
    publicKey.excludeCredentials = publicKey.excludeCredentials.map(c => ({
      ...c,
      id: b64urlToBuffer(c.id)
    }));
  }

  return publicKey;
}

document.getElementById("btn").onclick = async () => {
  const msg = document.getElementById("msg");
  const out = document.getElementById("out");

  try {
    msg.textContent = "Meminta challenge passkey...";
    out.value = "";

    const startRes = await fetch(BACKEND + "/api/2fa/passkey-register-start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });

    const startData = await startRes.json();
    if (!startData.success) throw new Error(startData.error || "Gagal start passkey");

    msg.textContent = "Ikuti popup fingerprint / Face ID / PIN HP...";

    const credential = await navigator.credentials.create({
      publicKey: prepareOptions(startData.options)
    });

    const response = {
      id: credential.id,
      rawId: bufferToB64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToB64url(credential.response.clientDataJSON),
        attestationObject: bufferToB64url(credential.response.attestationObject),
        transports: credential.response.getTransports ? credential.response.getTransports() : []
      },
      clientExtensionResults: credential.getClientExtensionResults()
    };

    msg.textContent = "Mengirim passkey ke backend...";

    const finishRes = await fetch(BACKEND + "/api/2fa/passkey-register-finish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        response,
        session: startData.session
      })
    });

    const finishData = await finishRes.json();
    if (!finishData.success) throw new Error(finishData.error || "Gagal finish passkey");

    out.value = finishData.credentialJson;
    msg.textContent = "Berhasil. Copy credentialJson di bawah ke Vercel.";
  } catch (error) {
    msg.textContent = "ERROR: " + error.message;
  }
};
</script>
</body>
</html>
